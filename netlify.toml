# Netlify deployment for GCOS (TanStack Start, server-side rendered).
#
# One site serves all three portals; the subdomains are added as domain aliases:
#   globalcart-onlineshop.com           -> customer / main app
#   reseller.globalcart-onlineshop.com  -> reseller portal
#   admin.globalcart-onlineshop.com     -> admin portal
#
# Required environment variables on the Netlify site
# (Site configuration -> Environment variables):
#   VITE_SUPABASE_URL
#   VITE_SUPABASE_PUBLISHABLE_KEY
#   SUPABASE_URL
#   SUPABASE_PUBLISHABLE_KEY
#   SUPABASE_SERVICE_ROLE_KEY   (server-side only, never exposed to the browser)

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Pin the user functions directory so a stale value in the Netlify UI build
# settings can't override it. The SSR function itself is generated by Nitro
# into .netlify/functions-internal/server and is picked up automatically.
[functions]
  directory = "netlify/functions"

# Routing: Nitro's server function is registered on path "/*" with
# preferStatic, so static files in dist/ are served first and every other
# request (including admin./reseller. subdomains) reaches the SSR app.
# Do NOT add a "/* /.netlify/functions-internal/server 200" rewrite — that path
# is a build directory, not a URL, and the rewrite turns every page into a 404.
#
# Long-lived cache headers for /assets/* are emitted by Nitro into dist/_headers.
